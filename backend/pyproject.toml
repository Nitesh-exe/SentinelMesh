[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
